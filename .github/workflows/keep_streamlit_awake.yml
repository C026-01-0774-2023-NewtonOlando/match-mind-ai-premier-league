name: Keep MatchMind AI Streamlit Awake

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  wake-app:
    runs-on: ubuntu-24.04
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright & Chromium
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Visit App in Headless Browser & Wake If Sleeping
        run: |
          python - << 'EOF'
          from playwright.sync_api import sync_playwright

          APP_URL = "https://matchmind-ai-premier-league.streamlit.app/"

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              context = browser.new_context(
                  user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0.0.0 Safari/537.36"
              )
              page = context.new_page()
              print(f"Opening {APP_URL} ...")

              try:
                  # Use domcontentloaded so Streamlit's active WebSocket doesn't cause a 90s networkidle timeout
                  page.goto(APP_URL, wait_until="domcontentloaded", timeout=60000)
                  page.wait_for_timeout(12000)

                  wake_btn = page.locator("button:has-text('Yes, get this app back up!')")
                  if wake_btn.count() > 0:
                      print("App was sleeping! Clicking wake-up button...")
                      wake_btn.first.click()
                      page.wait_for_timeout(25000)
                  else:
                      print("App is awake! Holding WebSocket session...")
                      page.wait_for_timeout(15000)
              except Exception as e:
                  print(f"Non-fatal navigation warning: {e}")

              browser.close()
              print("Keep-alive check complete.")
          EOF
