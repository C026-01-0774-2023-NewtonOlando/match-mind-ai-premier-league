name: Keep MatchMind AI Streamlit Awake

on:
  schedule:
    # Runs automatically every 6 hours (at minute 0)
    - cron: "0 */6 * * *"
  workflow_dispatch: # Allows you to trigger it manually with 1 click

jobs:
  wake-app:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Playwright & Chromium
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Visit App in Headless Browser & Wake If Sleeping
        run: |
          python - << 'EOF'
          from playwright.sync_api import sync_playwright

          APP_URL = "https://matchmind-ai-premier-league.streamlit.app/"

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page()
              print(f"Opening {APP_URL} ...")
              page.goto(APP_URL, wait_until="networkidle", timeout=90000)
              page.wait_for_timeout(5000)

              # If the app is asleep, click the wake-up button
              wake_btn = page.locator("button:has-text('Yes, get this app back up!')")
              if wake_btn.count() > 0:
                  print("App was sleeping! Clicking wake-up button...")
                  wake_btn.first.click()
                  page.wait_for_timeout(25000)
              else:
                  print("App is already awake! Holding WebSocket session...")
                  page.wait_for_timeout(10000)

              browser.close()
              print("Keep-alive check complete.")
          EOF
